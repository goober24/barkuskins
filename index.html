<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barku Chan Loves You</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Main container for the content -->
  <div class="flex flex-col items-center p-8 bg-gray-800 rounded-3xl shadow-2xl space-y-6">

    <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight text-center leading-tight">
      Barku Chan Awaits
    </h1>

    <p class="text-lg sm:text-xl font-medium text-gray-300 text-center">
      ✨ Oki, click a button below to get a cute new picture of Barku-chan, send her an email, or even a Steam trade offer!
    </p>

    <!-- Image container -->
    <div class="relative w-full max-w-xl">
      <img id="barku-img"
           class="w-full h-auto rounded-xl shadow-xl transition-transform duration-300 transform hover:scale-105"
           src=""
           alt="Barku" />
    </div>

    <!-- Interactive buttons container with new layout -->
    <div class="flex flex-col items-center space-y-4 w-full max-w-sm">
      <!-- Image button on its own row -->
      <button id="next-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105 active:scale-95 w-full">
        ✨ See Barku-chan! ✨
      </button>

      <!-- Email and Trade buttons on a separate row -->
      <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 w-full">
        <a href="mailto:barkuchan@proton.me?subject=A%20message%20for%20Barku%20Chan"
           class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105 active:scale-95 text-center flex-1 flex items-center justify-center">
          💌 Email Barku!
        </a>

        <a href="https://steamcommunity.com/tradeoffer/new/?partner=1879042545&token=y4P82N29"
           class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105 active:scale-95 text-center flex-1 flex items-center justify-center"
           target="_blank">
          💖 Trade with Barku!
        </a>
      </div>
    </div>

  </div>

  <script>
    // List of local image filenames stored in the same repository.
    const images = [
      "barku_beach_6.png",
      "barku armpit.png",
      "barku cheeked.png",
      "barku epic.png",
      "barku koffie.png",
      "barku liggen.png",
      "barku rage.png",
      "barku sweat 2.png",
      "barku winter.png",
      "barku chill.png",
      "barku bunda.jpeg",
      "barku read.jpg"
    ];

    const barkuImg = document.getElementById("barku-img");
    const nextBtn = document.getElementById("next-btn");

    function displayRandomImage() {
      const selected = images[Math.floor(Math.random() * images.length)];
      barkuImg.src = selected;
    }

    // Set the initial image when the page loads
    window.onload = displayRandomImage;

    // Add a click listener to the button
    nextBtn.addEventListener('click', displayRandomImage);

  </script>

</body>
</html>
